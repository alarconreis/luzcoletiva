<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Sol estilizado -->
  <g transform="translate(900, 200)">
    <circle cx="0" cy="0" r="100" fill="#FFFFFF" opacity="0.85"/>
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-130" x2="0" y2="-160"/>
      <line x1="92" y1="-92" x2="113" y2="-113"/>
      <line x1="130" y1="0" x2="160" y2="0"/>
      <line x1="92" y1="92" x2="113" y2="113"/>
      <line x1="0" y1="130" x2="0" y2="160"/>
      <line x1="-92" y1="92" x2="-113" y2="113"/>
      <line x1="-130" y1="0" x2="-160" y2="0"/>
      <line x1="-92" y1="-92" x2="-113" y2="-113"/>
    </g>
  </g>

  <!-- Texto principal -->
  <text x="80" y="280" font-family="Poppins, system-ui, sans-serif" font-weight="800" font-size="96" fill="#1a1a1a">
    Luz Coletiva
  </text>
  <text x="80" y="350" font-family="Poppins, system-ui, sans-serif" font-weight="500" font-size="42" fill="#333333">
    Iluminando vidas juntos
  </text>
  <text x="80" y="445" font-family="Open Sans, system-ui, sans-serif" font-weight="400" font-size="32" fill="#444444">
    Conectando quem precisa de ajuda
  </text>
  <text x="80" y="490" font-family="Open Sans, system-ui, sans-serif" font-weight="400" font-size="32" fill="#444444">
    com quem pode ajudar.
  </text>

  <!-- URL -->
  <text x="80" y="570" font-family="Open Sans, system-ui, sans-serif" font-weight="600" font-size="28" fill="#1565C0">
    luzcoletiva.com.br
  </text>
</svg>
